name: Update purchases from spreadsheet
 
on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:       # adds a "Run workflow" button for manual updates
 
permissions:
  contents: write
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - run: pip install openpyxl
 
      - name: Download spreadsheet from the cloud
        run: curl -L --fail -o Space_School_Purchases.xlsx "${{ secrets.XLSX_SPACESCHOOL }}"
 
      - name: Rebuild README and CSV
        run: |
          python xlsx_to_markdown.py Space_School_Purchases.xlsx
          rm Space_School_Purchases.xlsx
 
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md *.csv
          git diff --cached --quiet || (git commit -m "Update purchases from spreadsheet" && git push)
