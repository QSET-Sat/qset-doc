name: Update purchases from spreadsheet

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:       # adds a "Run workflow" button for manual updates

permissions:
  contents: write

env:
  OUT_DIR: "docs/subteams/spaceschool/Future Plan"   # <-- folder where README.md and the CSV go (use "." for the main folder)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl

      - name: Download spreadsheet from the cloud
        run: curl -L --fail -o Space_School_Purchases.xlsx "${{ secrets.XLSX_SPACESCHOOL }}"

      - name: Rebuild README and CSV
        run: |
          mkdir -p "$OUT_DIR"
          cd "$OUT_DIR"
          python "$GITHUB_WORKSPACE/xlsx_to_markdown.py" "$GITHUB_WORKSPACE/Space_School_Purchases.xlsx"
          rm "$GITHUB_WORKSPACE/Space_School_Purchases.xlsx"

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_DIR"/README.md "$OUT_DIR"/*.csv
          git diff --cached --quiet || (git commit -m "Update purchases from spreadsheet" && git push)
